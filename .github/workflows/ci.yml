name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, stated rather than inherited. This workflow only reads the
# tree: it publishes nothing, comments on nothing, and pushes nothing, so a
# token that can write is a token that can be misused. `pull_request` — NOT
# `pull_request_target` — is what keeps a fork's code out of a context holding
# secrets; a run triggered by a fork gets no access to them either way.
permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 and 20 are both EOL, but 18 is the floor package.json declares in
        # "engines" and an untested compatibility claim is not a claim. 22 is
        # maintenance LTS; 24 is active LTS and the development version.
        # The four jobs run in parallel, so breadth costs wall-clock nothing.
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v5
        with:
          # Do not leave the token in .git/config, where any later step — or
          # anything a dependency's install script runs — could pick it up.
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Verify publishable contents
        run: npm pack --dry-run
