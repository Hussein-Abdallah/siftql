name: Release

# Publishing from CI rather than a laptop is what makes PROVENANCE possible:
# npm asks Sigstore to attest that this exact tarball was built by this repo,
# from a named commit, by a named workflow. A publish from a developer machine
# cannot be attested, because nothing outside that machine saw it happen.
on:
  release:
    types: [published]
  # Manual re-run, for when a publish fails after the release already exists.
  workflow_dispatch:

permissions:
  contents: read
  # REQUIRED for provenance. This is what lets the job mint the short-lived
  # OIDC token Sigstore signs with; without it `--provenance` fails outright.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # A named environment gives the publish an approval gate and somewhere to
    # scope the npm token, so a compromised workflow on another branch cannot
    # reach it.
    environment: npm

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          # Sets up .npmrc against the public registry, which is where the
          # trusted-publisher connection lives.
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # The same gate every push runs. A release is the worst possible moment
      # to discover the build is broken, and the tarball is built from `dist/`
      # which this produces.
      - name: Verify
        run: npm run verify

      # A tag that disagrees with package.json publishes the wrong version
      # under the right name, and npm versions are immutable — so this is
      # checked before anything is sent, not after.
      - name: Tag matches package.json
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $GITHUB_REF_NAME implies $TAG, package.json says $PKG"
            exit 1
          fi
          echo "both agree on $PKG"

      # NO TOKEN. A trusted-publisher connection on npm names this repo, this
      # workflow file and the `npm` environment, so GitHub mints a short-lived
      # OIDC token and npm verifies it came from exactly here. Nothing
      # long-lived exists to leak, rotate, or commit by accident.
      #
      # `--provenance` is implied by a trusted-publisher publish, but stated so
      # the attestation is not silently lost if the connection is ever removed.
      - name: Publish
        run: npm publish --provenance
